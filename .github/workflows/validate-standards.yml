name: validate-standards

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the authorship check needs both ends of the pull
          # request range below, and falls back to scanning everything on push.
          fetch-depth: 0

      - name: Validate standards repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            ./scripts/validate-standards.sh --range "$BASE_SHA..$HEAD_SHA"
          else
            ./scripts/validate-standards.sh
          fi

      # A git hook cannot see a pull request body. Without this step the
      # "no agent traces" rule would be mandatory and unenforced by half.
      # The body is untrusted input: it is passed by environment variable and
      # piped in, never interpolated into the command.
      - name: Check pull request body for agent traces
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$PR_TITLE" "$PR_BODY" | ./scripts/check-pr-body.sh -
